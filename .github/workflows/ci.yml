name: CI

# The tests run on pull requests (and by hand), not again on main after the merge. The last job records the tree that
# passed (pr-proof): Main Gate lets main be deployed only when main's tree is that tree (.github/workflows/main-gate.yml).
on:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: PHP · JavaScript · TypeScript · Pint · البناء
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: alopera_gym_testing
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql, gd, zip, bcmath, intl, pcntl, posix   # pcntl, posix: ConcurrencyTest runs requests in parallel processes
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: composer install --no-interaction --prefer-dist
      - run: cp .env.example .env && php artisan key:generate
      - run: npm ci
      - run: npx tsc --noEmit -p tsconfig.json
      - run: npm test
        env:
          LARAVEL_BYPASS_ENV_CHECK: 1   # vitest loads vite.config, whose Laravel plugin refuses a dev server in CI
      - run: npm run build
      - run: vendor/bin/pint --test
      - run: php artisan test

  # What passed, written down: the pull request, its head, and the tree tested (refs/pull/N/merge, main with the pull
  # request merged in). Main Gate compares main's tree after the merge with this one.
  pr-proof:
    name: إثبات الشجرة المختبَرة
    if: github.event_name == 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
      - name: كتابة الإثبات
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          TESTED_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          [ "$GITHUB_REF" = "refs/pull/${PR_NUMBER}/merge" ] || { echo "::error::${GITHUB_REF} is not refs/pull/${PR_NUMBER}/merge"; exit 1; }
          [ "$(git rev-parse HEAD)" = "$TESTED_SHA" ] || { echo "::error::checked out commit is not ${TESTED_SHA}"; exit 1; }

          # main moved while this was tested: what would be merged now was not tested.
          git fetch --no-tags --quiet origin +refs/heads/main:refs/remotes/origin/main
          TESTED_BASE=$(git rev-parse 'HEAD^1')
          CURRENT_MAIN=$(git rev-parse origin/main)
          if [ "$TESTED_BASE" != "$CURRENT_MAIN" ]; then
            echo "::error title=PR proof::main moved while this pull request was tested (tested on ${TESTED_BASE}, main is now ${CURRENT_MAIN}): update the branch from main so CI tests what will be merged"
            exit 1
          fi

          jq -n \
            --argjson pr_number "$PR_NUMBER" \
            --arg head_sha "$HEAD_SHA" \
            --arg base_sha "$BASE_SHA" \
            --arg tested_base_sha "$TESTED_BASE" \
            --arg tested_commit_sha "$TESTED_SHA" \
            --arg tested_ref "$GITHUB_REF" \
            --arg tested_tree_sha "$(git rev-parse 'HEAD^{tree}')" \
            --argjson workflow_run_id "$RUN_ID" \
            --argjson workflow_run_attempt "$RUN_ATTEMPT" \
            '{pr_number: $pr_number, head_sha: $head_sha, base_sha: $base_sha, tested_base_sha: $tested_base_sha,
              tested_commit_sha: $tested_commit_sha, tested_ref: $tested_ref, tested_tree_sha: $tested_tree_sha,
              workflow_run_id: $workflow_run_id, workflow_run_attempt: $workflow_run_attempt}' > pr-proof.json
          cat pr-proof.json
          { echo "### إثبات الشجرة المختبَرة"; printf '```json\n%s\n```\n' "$(cat pr-proof.json)"; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: pr-proof-${{ github.event.pull_request.number }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: pr-proof.json
          if-no-files-found: error
