name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: alopera_gym_testing
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql, gd, zip, bcmath, intl
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: composer install --no-interaction --prefer-dist
      - run: cp .env.example .env && php artisan key:generate
      - run: npm ci
      - run: npx tsc --noEmit -p tsconfig.json
      - run: npm run build
      - run: vendor/bin/pint --test
      - run: php artisan test

  # Every push to main that passed the tests gets the next version tag (pull requests merged on GitHub included).
  # A tag deploys nothing.
  tag:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: tag-main
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - id: tag
        run: scripts/ci-tag.sh "$GITHUB_SHA"
      # The built pages (public/build) attached to the version, so the 1 GB droplet downloads them instead of
      # building (scripts/deploy.sh). Built from the tagged commit; nothing in the build comes from .env.
      - if: steps.tag.outputs.tag != ''
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - if: steps.tag.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 && { echo "release $TAG already there"; exit 0; }
          npm ci --no-audit --no-fund
          npm run build
          tar -czf build.tar.gz -C public build
          sha256sum build.tar.gz > build.tar.gz.sha256
          gh release create "$TAG" build.tar.gz build.tar.gz.sha256 --verify-tag --notes-from-tag --title "$TAG"
