# /etc/nginx/sites-available/aloperagym.om — the gym's two addresses on one Laravel release:
#
#   https://aloperagym.om       the website and the member portal (www → bare domain)
#   https://app.aloperagym.om   the panel and the staff sign-in (APP_URL)
#
# The application keeps them apart itself (App\Http\Middleware\ResolveCustomDomain): on aloperagym.om /app, /login
# and the other panel paths move to app.aloperagym.om (GET, 301; a POST is refused, never redirected), and on
# app.aloperagym.om old /c/<club>/… links move to the website. Webhooks (/webhooks/*), the devices API (/api/*),
# /up, /build and /storage answer on both, so integrations registered with either address keep working.
# This file adds HTTPS, the certificates and file protection only — no path rules to keep in step with the code.
#
# Certificates (Let's Encrypt, webroot, renewed by certbot's systemd timer; nginx reloaded by the deploy hook):
#   sudo certbot certonly --webroot -w /var/www/letsencrypt -d aloperagym.om -d www.aloperagym.om
#   sudo certbot certonly --webroot -w /var/www/letsencrypt -d app.aloperagym.om
#   echo 'systemctl reload nginx' | sudo tee /etc/letsencrypt/renewal-hooks/deploy/reload-nginx.sh && sudo chmod +x $_
# Paths below are certbot's defaults; check `sudo certbot certificates` on the server and adjust before enabling.

# HTTP: certificate challenges, everything else to HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name aloperagym.om www.aloperagym.om app.aloperagym.om;
    location ^~ /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://$host$request_uri; }
}

# www → the bare domain.
server {
    listen 443 ssl http2;                 # nginx 1.24 (Ubuntu 24.04); from 1.25.1: `listen 443 ssl;` + `http2 on;`
    listen [::]:443 ssl http2;
    server_name www.aloperagym.om;
    ssl_certificate     /etc/letsencrypt/live/aloperagym.om/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aloperagym.om/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    location ^~ /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://aloperagym.om$request_uri; }
}

# The website and the member portal.
server {
    listen 443 ssl http2;                 # nginx 1.24 (Ubuntu 24.04); from 1.25.1: `listen 443 ssl;` + `http2 on;`
    listen [::]:443 ssl http2;
    server_name aloperagym.om;
    ssl_certificate     /etc/letsencrypt/live/aloperagym.om/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aloperagym.om/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header X-Frame-Options "SAMEORIGIN" always;
    location ^~ /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    include snippets/alopera-laravel.conf;
}

# The panel: never indexed by search engines.
server {
    listen 443 ssl http2;                 # nginx 1.24 (Ubuntu 24.04); from 1.25.1: `listen 443 ssl;` + `http2 on;`
    listen [::]:443 ssl http2;
    server_name app.aloperagym.om;
    ssl_certificate     /etc/letsencrypt/live/app.aloperagym.om/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.aloperagym.om/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    location ^~ /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    include snippets/alopera-laravel.conf;
}
