# Shared by both server blocks of aloperagym.om.conf: the one Laravel release, PHP-FPM 8.4, built files, uploads.
# Installed as /etc/nginx/snippets/alopera-laravel.conf.

root /var/www/alopera-gym/current/public;
index index.php;
charset utf-8;
client_max_body_size 20m;                 # documents, transfer proofs, images, chat files (WHATSAPP_MEDIA_MAX_MB=16)
server_tokens off;

add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Strict-Transport-Security "max-age=31536000" always;

gzip on;
gzip_types text/css application/javascript application/json image/svg+xml;

# Built pages (hashed names): cached for a year.
location ^~ /build/ {
    expires 1y;
    add_header Cache-Control "public, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
}

# Public uploads (storage:link → shared/storage/app/public): logos, website images. Never run as PHP, and never sent as
# text either: ^~ keeps the server's own .php rules out of this folder, so a PHP-like name (any case, php3-8, phtml,
# phar, phps, pht, a trailing dot) is refused here. Images, PDFs and other files are served as they are.
location ^~ /storage/ {
    expires 30d;
    location ~* \.(php[0-9]*|phtml|phar|phps|pht)[.\s]*$ { return 404; }
    try_files $uri =404;
}

location = /favicon.ico { access_log off; log_not_found off; try_files $uri =404; }
location = /robots.txt  { access_log off; log_not_found off; try_files $uri /index.php?$query_string; }

# Hidden files (.env, .git…) and files that are never served, wherever they are.
location ~ /\.(?!well-known) { deny all; }
location ~* \.(env|log|sql|sqlite|bak|old|orig|swp|dist|lock|sh|ini|ya?ml|md)$ { deny all; }

location / {
    try_files $uri $uri/ /index.php?$query_string;
}

# Only the front controller runs PHP.
location = /index.php {
    fastcgi_pass unix:/run/php/php8.4-fpm.sock;
    fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
    fastcgi_param DOCUMENT_ROOT $realpath_root;
    include fastcgi_params;
    fastcgi_hide_header X-Powered-By;
    fastcgi_read_timeout 60s;
}
location ~ \.php$ { return 404; }
