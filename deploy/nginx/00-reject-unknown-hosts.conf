# /etc/nginx/sites-available/00-reject-unknown-hosts (linked into sites-enabled) — the default server on 80 and 443.
#
# A request naming a host that no server block names (a forged Host, the server's IP address, no Host at all) is closed
# without an answer: no page, no redirect, no link built from that host, and no nginx default page. Over HTTPS, an
# unknown name or no SNI at all is refused during the TLS handshake (ssl_reject_handshake, nginx 1.19.4+), so no
# certificate is shown either. The gym's names (aloperagym.om.conf) are not affected; Laravel checks the Host again
# (App\Http\Middleware\TrustHosts).
#
# It is the only default_server: the stock Ubuntu site (/etc/nginx/sites-enabled/default) must be unlinked, as it also
# claims port 80 (nginx -t says "a duplicate default server" otherwise). Installed on the server 2026-11-11.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
    return 444;
}
