; /etc/supervisor/conf.d/alopera-gym-worker.conf
; Queue workers: WhatsApp notifications and campaigns run on the "notifications" queue.
[program:alopera-gym-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/alopera-gym/current/artisan queue:work --queue=notifications,default --sleep=3 --tries=4 --max-time=3600
user=deploy
numprocs=2
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=3600
redirect_stderr=true
stdout_logfile=/var/www/alopera-gym/shared/storage/logs/worker.log
